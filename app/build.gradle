plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.highroller'
    compileSdk 33

    defaultConfig {
        applicationId "com.hiroller"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            def store = keystoreProps['storeFile'] ?: System.getenv('KEYSTORE_FILE')
            if (store) {
                storeFile rootProject.file(store)
                storePassword keystoreProps['storePassword'] ?: System.getenv('KEYSTORE_PASSWORD')
                keyAlias keystoreProps['keyAlias'] ?: System.getenv('KEY_ALIAS') ?: 'hiroller'
                keyPassword keystoreProps['keyPassword'] ?: System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.room:room-runtime:2.5.2'
    implementation 'androidx.room:room-ktx:2.5.2'
    // Uncomment when you add your Supabase / Colyseus credentials:
    // implementation 'io.github.jan-tennert.supabase:gotrue-kt:2.0.0'
    // implementation 'io.github.jan-tennert.supabase:postgrest-kt:2.0.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
